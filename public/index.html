<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levanter – Panneau des bots</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--tx:#14201a;--mut:#5d6b64;--bd:#dfe6e2;--ok:#1a9d55;--ko:#d6453d;--ac:#128c4a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#17211c;--tx:#e8f0eb;--mut:#93a39a;--bd:#263229;--ok:#3ddc84;--ko:#ff6b63;--ac:#25d366}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 16px}h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:inherit;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg);width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer;width:auto}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.bot{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.bot:first-of-type{border-top:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--ko)}
.dot.on{background:var(--ok)}
.mut{color:var(--mut);font-size:.9rem}
#msg{position:sticky;bottom:8px;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--bd);display:none}
.hide{display:none}
label{display:block;margin:8px 0 4px;font-size:.9rem;color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>🤖 Levanter – Panneau des bots</h1>

  <section id="login" class="card hide">
    <h2>Connexion</h2>
    <form id="loginForm" class="row">
      <input id="pwd" type="password" placeholder="Mot de passe du panneau" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required style="flex:1">
      <button>Entrer</button>
    </form>
  </section>

  <div id="app" class="hide">
    <section class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Bots connectés</h2>
        <button class="sec" id="refresh">Actualiser</button>
      </div>
      <div id="sessions" class="mut" style="margin-top:8px">Chargement…</div>
    </section>

    <section class="card">
      <h2>Ajouter un bot</h2>
      <label for="sid">SESSION_ID</label>
      <input id="sid" placeholder="levanter_xxxxxxxx" autocomplete="off">
      <p class="mut">L'ID est ajouté à <code>config.env</code>. Redémarre ensuite pour connecter le bot.</p>
      <div class="row">
        <button id="addBtn">Ajouter</button>
        <button id="restartBtn" class="sec">Redémarrer le bot</button>
      </div>
    </section>

    <section class="card">
      <h2>Envoyer un message test</h2>
      <label for="sess">Bot</label><select id="sess"></select>
      <label for="to">Numéro (ex. 33612345678) ou groupe @g.us</label><input id="to" inputmode="tel">
      <label for="text">Message</label><textarea id="text" rows="3"></textarea>
      <div class="row" style="margin-top:10px"><button id="sendBtn">Envoyer</button></div>
    </section>
  </div>
  <div id="msg" role="status"></div>
</main>

<script>
const $ = (id) => document.getElementById(id)
const say = (t, err) => { const m = $('msg'); m.textContent = t; m.style.display = 'block'; m.style.borderColor = err ? 'var(--ko)' : 'var(--ok)'; clearTimeout(say.t); say.t = setTimeout(() => m.style.display = 'none', 5000) }
const call = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  const d = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/panel/login') showLogin()
  if (!r.ok) throw new Error(d.error || d.message || 'Erreur ' + r.status)
  return d
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const showLogin = () => { $('login').classList.remove('hide'); $('app').classList.add('hide') }

async function load() {
  $('sessions').textContent = 'Chargement…'
  try {
    const { sessions = [] } = await call('/panel/sessions')
    $('sessions').innerHTML = sessions.length ? sessions.map((s) => `
      <div class="bot"><div><span class="dot ${s.connected ? 'on' : ''}"></span><b>${esc(s.name || 'Bot ' + s.id)}</b>
      <div class="mut">Session ${esc(s.id)} · ${s.number ? '+' + esc(s.number) : 'non connecté'}</div></div>
      <span class="mut">${s.connected ? 'En ligne' : 'Hors ligne'}</span></div>`).join('') : 'Aucun bot pour le moment.'
    $('sess').innerHTML = sessions.map((s) => `<option value="${esc(s.id)}">${esc(s.name || 'Bot ' + s.id)} ${s.connected ? '' : '(hors ligne)'}</option>`).join('')
  } catch (e) { $('sessions').textContent = 'Impossible de joindre l\'API du bot (API_MODE=true et API_KEY requis). ' + e.message }
}
async function enter() { $('login').classList.add('hide'); $('app').classList.remove('hide'); load() }

$('loginForm').onsubmit = async (e) => { e.preventDefault(); try { await call('/panel/login', { password: $('pwd').value }); enter() } catch (er) { say(er.message, true) } }
$('refresh').onclick = load
$('addBtn').onclick = async () => { try { const d = await call('/panel/add-session', { sessionId: $('sid').value }); $('sid').value = ''; say(d.note) } catch (e) { say(e.message, true) } }
$('restartBtn').onclick = async () => { if (!confirm('Redémarrer le bot ?')) return; try { await call('/panel/restart', {}); say('Redémarrage en cours…'); setTimeout(load, 8000) } catch (e) { say(e.message, true) } }
$('sendBtn').onclick = async () => {
  const b = $('sendBtn'); b.disabled = true
  try { await call('/panel/send', { session: $('sess').value, to: $('to').value.trim(), type: 'text', text: $('text').value }); say('Message envoyé ✅') }
  catch (e) { say(e.message, true) } finally { b.disabled = false }
}
call('/panel/me').then(enter).catch(showLogin)
</script>
</body>
</html>
